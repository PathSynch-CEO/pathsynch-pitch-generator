name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs for the same branch/PR to avoid queueing duplicate runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Principle of least privilege — no write permissions by default
permissions:
  contents: read

jobs:
  test:
    name: Test & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions

    steps:
      # TODO: upgrade to actions/checkout@v5 and actions/setup-node@v5 when available (Node 20 deprecation)
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test

      - name: Security audit
        # Accept moderate transitive vulns from firebase-admin/google SDK — only block on critical
        run: npm audit --audit-level=critical

  emulator-tests:
    # F-601: run the emulator-backed rules suites (P0 share-leak prevention + Gate #7
    # tenant isolation) against the real firestore.rules, so a rules regression is
    # caught before merge. These are excluded from the mocked `npm test` run above.
    name: Emulator Tests (rules)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Setup Java (Firestore emulator runtime)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          # firebase-tools v15+ requires JDK 21+ for the emulator runtime.
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run emulator-backed rules tests
        run: npm run test:emulator

  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      id-token: write
    # F-701: CI auto-deploy DISABLED. Merges to main were auto-deploying all functions to
    # production — unreviewed and from a runner without functions/.env. WIF/ADC authentication
    # is configured below, but deployment stays disabled until environment injection is solved
    # and a production deploy is separately authorized. Re-enable only under that approval by
    # restoring the original condition:
    #   github.ref == 'refs/heads/main' && github.event_name == 'push'
    if: false
    timeout-minutes: 20
    environment: production

    steps:
      - uses: actions/checkout@v7

      - name: Authenticate through Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: pathsynch-pitch-creation
          workload_identity_provider: projects/796921234100/locations/global/workloadIdentityPools/github-actions/providers/pathsynch-pitch-generator
          service_account: gh-synchintro-functions@pathsynch-pitch-creation.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Deploy to Firebase
        run: npx firebase-tools deploy --only functions --project pathsynch-pitch-creation --non-interactive
